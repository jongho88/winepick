<style>
:root{
  --wine:#B30737;--wine2:#B30737;--wine3:#E0315F;--blush:#FBE3EA;
  --cream:#FBF6F0;--card:#FFFFFF;--ink:#2A1A1D;--muted:#7A6567;--line:#EADDD4;
  --gold:#B88A3E;--green:#4E7A55;
  --r:18px;--shadow:0 1px 2px rgba(60,20,30,.06),0 6px 20px rgba(60,20,30,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(251,246,240,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.brand{display:flex;align-items:center;gap:6px;color:var(--wine);background:none;border:0;padding:0}
.brand .script{font-size:18px;line-height:1;color:#fff;font-weight:400;letter-spacing:.14em}
.brand .b-glass{width:24px;height:32px;transform:rotate(-8deg)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
main{flex:1;padding:8px 18px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:6;
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{border:0;background:none;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--wine);font-weight:700}
h1{font-size:27px;line-height:1.3;letter-spacing:-.03em;margin:14px 0 6px}
h2{font-size:21px;line-height:1.35;letter-spacing:-.02em;margin:22px 0 10px}
h3{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:12px 0}
.hero{background:linear-gradient(160deg,var(--wine) 0%,#7A0424 100%);color:#FBEFE8;border-radius:24px;padding:24px 20px 22px;margin-top:10px;position:relative;overflow:hidden}
.hero h1{color:#fff;margin-top:0}
.hero p{color:#F0D9D2}
.hero .deco{position:absolute;right:-18px;bottom:-18px;width:130px;opacity:.18}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--wine);color:#fff;min-height:50px}
.btn.block{width:100%}
.btn.light{background:#fff;color:var(--wine)}
.btn.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--wine)}
.btn.soft{background:var(--blush);color:var(--wine)}
.btn.danger{background:#fff;color:#B30737;border:1.5px solid #F2B5C6}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.steps{display:grid;gap:10px;margin-top:14px}
.step{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left;width:100%}
.step .num{flex:none;width:38px;height:38px;border-radius:12px;background:var(--blush);color:var(--wine);font-weight:800;display:grid;place-items:center}
.step .arr{margin-left:auto;color:var(--muted)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--blush);color:var(--wine);font-size:13px;font-weight:600;margin:0 6px 6px 0}
.chip.gray{background:#F1ECE7;color:var(--muted)}
/* learn */
.lcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-top:18px;scroll-margin-top:76px}
.ljump{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.ljump::-webkit-scrollbar{display:none}
.ljump button{flex:none;border:1px solid rgba(247,199,210,.35);background:rgba(255,255,255,.06);color:#F7C7D2;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.lart{background:var(--blush);padding:22px 18px;min-height:150px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.lbody{padding:20px 20px 6px}
.lbody .kicker{font-size:13px;font-weight:700;color:var(--wine3);letter-spacing:.02em}
.tip{background:#FFF7E8;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.tip b{color:var(--gold)}
.en{font-size:.82em;font-weight:500;color:#9C7C84;margin-left:5px;letter-spacing:.01em;font-style:italic}
b + .en{font-style:italic}
.dots{display:flex;justify-content:center;gap:6px;margin:16px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--wine);width:20px;border-radius:4px}
.list{margin:6px 0 10px;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.glassrow{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;color:var(--wine)}
.label{background:#FFFDF8;border:1.5px solid #D9C9B5;border-radius:6px;width:210px;padding:12px 12px 10px;text-align:center;font-family:Georgia,"Times New Roman",serif;position:relative}
.label .l1{font-size:11px;letter-spacing:.15em;color:#8a7a6a}
.label .l2{font-size:20px;color:var(--wine);margin:2px 0}
.label .l3{font-size:13px;color:#4b3b35}
.label .l4{display:flex;justify-content:space-between;font-size:11px;color:#8a7a6a;margin-top:8px}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--wine3);color:#fff;font:700 11px system-ui;font-style:normal}
.label .pin{position:absolute}
/* quiz */
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 6px}
.progress i{display:block;height:100%;background:var(--wine);border-radius:4px;transition:width .3s}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;font-size:16px;font-weight:600}
.opt .o{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.opt.on{border-color:var(--wine);background:#FFF5F8}
.opt.on .o{border:7px solid var(--wine)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.back{border:0;background:none;color:var(--muted);padding:6px 0;display:inline-flex;gap:4px;align-items:center}
/* result */
.profile{background:linear-gradient(160deg,#FFF 0%,var(--blush) 100%);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-top:12px}
.nick{font-size:24px;font-weight:800;color:var(--wine);letter-spacing:-.03em;margin:2px 0 10px}
.taste{display:grid;grid-template-columns:62px 1fr;gap:6px 10px;align-items:center;font-size:14px}
.bar{display:flex;gap:4px}
.bar i{flex:1;height:8px;border-radius:4px;background:#EADDD4}
.bar i.on{background:var(--wine3)}
.wine{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.whead{display:flex;gap:14px;align-items:center;padding:18px 18px 10px}
.whead .g{flex:none;width:54px;height:66px;border-radius:14px;background:var(--cream);display:grid;place-items:center}
.whead .rank{font-size:12px;font-weight:800;color:var(--wine3)}
.wbody{padding:0 18px 18px}
.why{background:#FFF5F8;border-left:3px solid var(--wine3);border-radius:0 12px 12px 0;padding:10px 12px;margin:10px 0;font-size:15px}
.why div{margin:2px 0}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:15px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.ask{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
/* records */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center}
.stat b{display:block;font-size:21px;color:var(--wine)}
.stat span{font-size:12px;color:var(--muted)}
.rec{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;box-shadow:var(--shadow);padding:14px;margin:10px 0}
.rec .g{flex:none;width:44px;height:54px;border-radius:12px;background:var(--cream);display:grid;place-items:center}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:#E0A83B;letter-spacing:1px;font-size:14px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty svg{width:70px;opacity:.5}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,10,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--cream);width:100%;max-width:520px;max-height:72vh;max-height:72dvh;overflow:auto;overscroll-behavior:contain;position:relative;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:#D8C9BF;margin:4px auto 10px}
.sheet-top{position:sticky;top:-10px;z-index:2;background:var(--cream);margin:-10px -18px 0;padding:10px 18px 2px}
.sheet-x{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#EFE6DE;color:#6b5a5c;display:grid;place-items:center}
.scrim{cursor:pointer}.sheet{cursor:auto}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.field{margin:14px 0}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--wine3)}
.starpick{display:flex;gap:6px}
.starpick button{border:0;background:none;font-size:34px;line-height:1;color:#E3D6CC;padding:0 2px}
.starpick button.on{color:#E0A83B}
.seg{display:flex;background:#EFE6DE;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--wine);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2A1A1D;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin:26px 0 6px}
.sec-title{display:flex;justify-content:space-between;align-items:center}
.sec-title h2{margin-bottom:6px}
.link{border:0;background:none;color:var(--wine);font-weight:700;padding:4px}
.mini{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.mini::-webkit-scrollbar{display:none}
.minicard{flex:none;width:150px;background:var(--card);border:0;border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:left}
.minicard b{display:block;font-size:14px;line-height:1.35;margin-top:6px}
/* ---------- 시작 화면 ---------- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 30%,#C8124A 0%,#8A0529 45%,#3D0213 100%);color:#FBEFE8;overflow:hidden;cursor:pointer;
  transition:transform .8s cubic-bezier(.7,0,.2,1),opacity .8s ease}
#splash:focus{outline:none}
#splash.out{transform:translateY(-100%);opacity:.6}
#splash .glow{position:absolute;width:420px;height:420px;border-radius:50%;top:50%;left:50%;margin:-280px 0 0 -210px;
  background:radial-gradient(circle,rgba(255,190,170,.35) 0%,rgba(255,190,170,0) 65%);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
#splash .bub{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,225,210,.55);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx,0));opacity:0}}
.sp-glass{position:relative;width:156px;height:260px;transform-origin:50% 92%;
  animation:drop .7s cubic-bezier(.2,1.4,.4,1) both, sway 2.2s ease-in-out .7s infinite}
@keyframes drop{from{transform:translateY(-60px) scale(.6);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.sp-glass svg{width:100%;height:100%;overflow:visible}
.sp-fill{animation:fill 1.6s cubic-bezier(.4,0,.2,1) .5s both}
@keyframes fill{from{transform:translateY(112px)}to{transform:translateY(56px)}}
.sp-surf{transform-box:fill-box;transform-origin:center;animation:slosh 2.2s ease-in-out .7s infinite}
@keyframes slosh{0%,100%{transform:rotate(0) scaleY(1)}25%{transform:rotate(4deg) scaleY(1.15)}75%{transform:rotate(-4deg) scaleY(1.15)}}
.sp-wave{animation:wave 1.1s linear infinite}
.sp-wave2{animation:wave 1.7s linear infinite reverse;opacity:.55}
@keyframes wave{from{transform:translateX(-60px)}to{transform:translateX(0)}}
.sp-pour{stroke-dasharray:120;stroke-dashoffset:120;animation:pour 1.7s ease .35s both}
@keyframes pour{25%{stroke-dashoffset:0;opacity:1}75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-120;opacity:0}}
.sp-spark{transform-origin:center;transform-box:fill-box;animation:spark 1.8s ease-in-out infinite;opacity:0}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.script{font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,"Helvetica Neue",sans-serif;font-weight:200;letter-spacing:.05em}
.sp-titlewrap{position:relative;margin-top:14px;display:flex;flex-direction:column;align-items:center}
.sp-title{font-size:58px;line-height:1.25;padding:0 18px;letter-spacing:.08em;
  background:linear-gradient(100deg,#FFF3E6 0%,#F9CFC4 35%,#E9BC6E 48%,#FFF6E8 52%,#F9CFC4 65%,#FFF3E6 100%);background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,170,150,.35));
  clip-path:inset(-20% 100% -20% 0);animation:write 1.6s cubic-bezier(.45,.1,.3,1) 1.1s forwards, shimmer 3.2s ease-in-out 2.9s infinite}
@keyframes write{to{clip-path:inset(-20% -5% -20% 0)}}
@keyframes shimmer{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.sp-flourish{width:230px;height:26px;margin-top:-10px;overflow:visible}
.sp-flourish path{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.1s ease-out 2.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-tag{margin-top:6px;font-size:16px;color:#F0D2CA;opacity:0;animation:tag .8s ease 2.7s forwards;letter-spacing:.02em}
@keyframes tag{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sp-skip{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;
  padding:12px 22px;border-radius:999px;border:1.5px solid rgba(255,220,210,.45);background:rgba(255,255,255,.08);
  font-size:16px;font-weight:700;color:#FFE9E2;opacity:0;animation:tag .7s ease 3.1s forwards, breathe 1.8s ease-in-out 3.8s infinite}
@keyframes breathe{50%{transform:scale(1.05);background:rgba(255,255,255,.16)}}
.tapdot{width:10px;height:10px;border-radius:50%;background:#F7B9B0;box-shadow:0 0 0 0 rgba(247,185,176,.7);animation:ping 1.8s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 12px rgba(247,185,176,0)}}
.sp-bar{position:absolute;bottom:calc(60px + env(safe-area-inset-bottom));width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;background:#F7B9B0;transform-origin:left;animation:prog 3.4s linear both}
@keyframes prog{from{transform:scaleX(0)}}
#app.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.98)}}
@media (prefers-reduced-motion:reduce){
  .sp-glass,.sp-fill,.sp-wave,.sp-wave2,.sp-title,.sp-flourish path,.sp-tag,.sp-pour,#splash .bub,#splash .glow,.sp-bar i{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
/* ---------- 와인 셀러 테마 ---------- */
html,body{background-color:#22070E;color:#F6E4E8;
  background-image:radial-gradient(90% 40% at 50% 0%,rgba(255,170,120,.16),transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 34px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 68px)}
:is(.card,.lcard,.wine,.rec,.step,.stat,.profile,.opt,.minicard,.sheet,.tip){color:var(--ink)}
.muted{color:#D7AEB8}
:is(.card,.lcard,.wine,.rec,.step,.stat,.profile,.opt,.minicard,.sheet,.tip) .muted{color:var(--muted)}
.top{background:rgba(34,7,14,.88);border-bottom:1px solid rgba(255,255,255,.06)}
.iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.iconbtn svg{stroke:#F7C7D2}
.tabs{background:rgba(24,5,10,.96);border-top:1px solid rgba(255,255,255,.08)}
.tab{color:#B98A95}.tab.on{color:#fff}
.link{color:#F7C7D2}
main .btn.ghost{color:#F7C7D2;border-color:rgba(247,199,210,.6)}
main :is(.card,.lcard,.wine) .btn.ghost{color:var(--wine);border-color:var(--wine)}
.dots i{background:rgba(255,255,255,.2)}.dots i.on{background:#F7C7D2}
.progress{background:rgba(255,255,255,.14)}.progress i{background:#E0315F}
.back{color:#D7AEB8}.foot{color:#B98A95}
h1.thin{font-weight:300;font-size:22px;letter-spacing:.01em;margin:16px 0 2px}
.cellar-sub{font-size:14px;color:#D7AEB8;margin-bottom:18px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;padding:0 6px;min-height:150px}
.plank{height:14px;border-radius:3px;background:linear-gradient(#9A6538,#5E3A1E);box-shadow:0 10px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,180,.35);position:relative}
.plank::before,.plank::after{content:"";position:absolute;top:14px;width:10px;height:16px;background:#3B230F;border-radius:0 0 3px 3px}
.plank::before{left:16px}.plank::after{right:16px}
.caps{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:20px 0 4px;font-size:15px;font-weight:600;color:#FBE3EA}
.caps small{display:block;font-size:12px;font-weight:400;color:#C99AA6}
.bt{justify-self:center;border:0;background:none;padding:0;display:flex;justify-content:center;align-items:flex-end;transition:transform .25s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.bt svg{width:60px;height:176px}
.bt:hover,.bt:focus-visible{transform:translateY(-10px) rotate(-3deg)}
.bt:active{transform:translateY(-16px) rotate(-4deg)}
.bt.hint{animation:nudge 3.2s ease-in-out 1.2s infinite}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:translateY(-8px) rotate(-4deg)}92%{transform:translateY(0) rotate(2deg)}}
.shelf-title{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 10px}
.shelf-title h2{margin:0;font-size:18px;font-weight:600}
.rack{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.slot{border:0;background:none;padding:0;text-align:left;color:#F6E4E8}
.slot .lb{position:relative;height:44px;display:flex;align-items:flex-end;padding:0 4px;transition:transform .2s}
.slot:active .lb{transform:translateX(6px)}
.slot svg{width:100%;height:40px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
.slot .tag{position:absolute;left:calc(11.4% + 7px);right:calc(46.6% + 7px);top:11px;height:26px;line-height:26px;font-size:10.5px;font-weight:700;color:#4A1220;display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.slot .plank{height:9px}.slot .plank::before,.slot .plank::after{display:none}
.slot .meta{font-size:12px;color:#C99AA6;margin-top:6px;display:flex;justify-content:space-between}
.slot .meta .stars{font-size:11px}
.slot.add .lb{border:1.5px dashed rgba(247,199,210,.4);border-radius:10px;justify-content:center;align-items:center;color:#F7C7D2;font-size:14px;font-weight:600;height:44px}
.mini-shelf{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:0 4px;gap:4px}
.mini-shelf .bt svg{width:34px;height:100px}
.mini-caps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:11.5px;line-height:1.3;color:#E9C6CF;margin-top:20px}
.cellar-cta{margin-top:30px;text-align:center;font-size:14px;color:#D7AEB8}
.cellar-cta b{color:#fff}
/* 사진 */
.photo-pick{border-radius:14px;overflow:hidden;background:#fff;border:1.5px dashed var(--line)}
.photo-pick img{display:block;width:100%;max-height:190px;object-fit:cover}
.pp-empty{width:100%;border:0;background:none;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--wine);font-weight:600;font-size:15px}
.pp-btns{display:flex;border-top:1px solid var(--line)}
.pp-btns button{flex:1;border:0;background:#fff;padding:11px;font-weight:600;color:var(--wine)}
.pp-btns button+button{border-left:1px solid var(--line);color:#A3273A}
.rec .g{overflow:hidden}
.rec .g.has{width:54px;height:54px;border-radius:12px}
.rec .g img{width:100%;height:100%;object-fit:cover;display:block}
.price-in{display:flex;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.price-in:focus-within{border-color:var(--wine3)}
.price-in button{border:0;background:var(--blush);color:var(--wine);font-weight:800;font-size:17px;width:46px}
.price-in input{border:0!important;border-radius:0!important;min-width:0}
.price-in input:focus{outline:none}
/* 메달 */
.medals{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 14px}
.medal{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#FBE3EA}
.medal small{display:block;font-size:10.5px;font-weight:400;color:#C99AA6;font-style:italic}
.medal-next{font-size:12px;color:#C99AA6}
main .stats + .medals .medal{color:#FBE3EA}
.celebrate{position:fixed;inset:0;z-index:40;background:rgba(20,4,9,.7);display:grid;place-items:center;padding:24px;animation:fade .25s}
.cel-card{position:relative;background:var(--cream);color:var(--ink);border-radius:24px;padding:24px 22px 20px;width:100%;max-width:330px;text-align:center;animation:popin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.cel-medal{margin-top:-70px;animation:spinin 1s cubic-bezier(.2,1.2,.4,1) .1s both}
@keyframes spinin{from{transform:rotateY(540deg) scale(.4);opacity:0}}
.cel-k{font-size:15px;font-weight:700;color:var(--wine3);margin-top:4px}
.cel-n{font-size:26px;font-weight:300;letter-spacing:.02em;margin-top:2px}
.cel-e{font-size:13px;color:var(--muted);font-style:italic}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) translateX(var(--dx)) rotate(720deg)}}
/* 숨은 와인병 */
.shelf{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.secret-wrap{position:absolute;bottom:0;width:48px;height:150px;overflow:hidden;transform:translateX(-50%);pointer-events:none}
.secret{pointer-events:auto;border:0;background:none;padding:0;display:block;width:48px;height:150px;transform:translateY(102%);transition:transform .8s cubic-bezier(.2,1.25,.4,1);filter:drop-shadow(0 0 10px rgba(243,217,164,.45))}
.secret.up{transform:none}
.secret svg{width:46px;height:135px;margin-top:15px}
.somm .cel-medal svg{filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.prods{background:#FBF7F1;border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;margin:12px 0}
.prods-h{font-size:14px;font-weight:700;color:var(--wine);margin-bottom:4px}
.prods-h span{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.prod{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0}
.pn{flex:1;min-width:0}
.pn b{display:block;font-size:14.5px;line-height:1.35}
.pn small{display:block;font-size:12px;color:var(--muted);font-style:italic;line-height:1.35}
.pr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tier{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#F1ECE7;color:var(--muted)}
.tier.t3{background:#FFF3DA;color:#9A6B12}
.tier.fit{background:var(--wine);color:#fff}
.pr a{font-size:12px;color:var(--wine3);font-weight:600;text-decoration:none}
.prods-note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:5px;margin:10px 0 12px}
.lvtabs button{position:relative;border:0;background:none;color:#D7AEB8;border-radius:12px;padding:8px 4px;font-size:15px;font-weight:700;line-height:1.2}
.lvtabs button small{display:block;font-size:10.5px;font-weight:500;font-style:italic;opacity:.8}
.lvtabs button.on{background:#FBF6F0;color:var(--wine)}
.lvok{position:absolute;top:4px;right:6px;width:16px;height:16px;border-radius:50%;background:#C9A04E;color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center}
.opt.qo.ok{border-color:#4E7A55;background:#F1F8F0}.opt.qo.ok .o{border:7px solid #4E7A55}
.opt.qo.no{border-color:#C2475E;background:#FFF2F4}.opt.qo.no .o{border:7px solid #C2475E}
.opt.qo:disabled{cursor:default;color:var(--ink)}
/* 라인 애니메이션 */
.lart.lineart{display:block;background:#2A0A13;padding:14px 10px 8px;min-height:0;position:relative}
.lineart svg{display:block;width:100%;height:auto;overflow:visible}
.lineart .replay svg{width:16px!important;height:16px!important;max-width:none;stroke-width:2.2;fill:none;animation:none}
.lineart .replay{position:absolute;right:10px;top:10px;z-index:1;border:1px solid rgba(243,230,218,.3);background:rgba(255,255,255,.06);color:#F3E6DA;border-radius:999px;font-size:12px;font-weight:600;padding:5px 11px;width:32px;height:32px;padding:0;display:grid;place-items:center}
.lineart .ln{fill:none;stroke:#F3E6DA;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lineart .ln.a{stroke:#E0315F}.lineart .ln.g{stroke:#D9B56A}.lineart .ln.r{stroke:#F29AAE}.lineart .ln.t{stroke-width:1.4}.lineart .ln.d{stroke-dasharray:4 5}
.lineart .fd{opacity:0;transition:opacity .5s ease}.lineart .fd.on{opacity:1}
.lineart text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#F3E6DA}
.lineart text.k{font-size:13px;font-weight:700}.lineart text.kk{font-size:10.5px;font-weight:700}
.lineart text.e{font-size:10px;fill:#C9A7AE;font-style:italic}
.lineart text.s{font-size:10.5px;fill:#D9C3C8}
.lineart text.ac{fill:#E0315F}.lineart text.go{fill:#D9B56A}
.brand{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .5s ease}
.brand.pressing{transform:scale(.92)}
.sister{font-size:12px;color:#B39098;text-decoration:none;letter-spacing:.04em;opacity:.8}
.share-url{font-size:15px;font-weight:700;color:var(--wine);background:#FBF3F5;border:1px dashed #E7B7BE;border-radius:10px;padding:8px 10px;text-align:center;margin:4px 0 10px;letter-spacing:.02em}
.qrbox{width:220px;height:220px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
/* 사진 자르기 */
.crop-ov{position:fixed;inset:0;z-index:60;background:#140308;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));animation:fade .2s}
.crop-top{text-align:center;color:#FBE3EA}.crop-top b{display:block;font-size:17px;font-weight:600}.crop-top span{font-size:13px;color:#C99AA6}
.crop-stage{position:relative;width:min(78vw,340px,calc((100vh - 260px)*.75));aspect-ratio:3/4;overflow:hidden;border-radius:14px;background:#000;touch-action:none;cursor:grab;box-shadow:0 0 0 2px rgba(247,199,210,.7),0 10px 30px rgba(0,0,0,.5)}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.25) 33.3%,rgba(255,255,255,.25) 33.5%,transparent 33.6%,transparent 66.5%,rgba(255,255,255,.25) 66.6%,rgba(255,255,255,.25) 66.8%,transparent 66.9%),linear-gradient(0deg,transparent 33.2%,rgba(255,255,255,.25) 33.3%,rgba(255,255,255,.25) 33.5%,transparent 33.6%,transparent 66.5%,rgba(255,255,255,.25) 66.6%,rgba(255,255,255,.25) 66.8%,transparent 66.9%)}
.crop-zoom{display:flex;align-items:center;gap:10px;width:min(78vw,340px)}
.crop-zoom input{flex:1;accent-color:#E0315F}
.crop-zoom button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(247,199,210,.4);background:rgba(255,255,255,.06);color:#F7C7D2;font-size:20px;line-height:1}
.pp-img{display:block;width:100%;height:100%;border:0;padding:0;margin:0;background:none;position:relative;cursor:pointer}
.pp-img img{display:block;width:100%;height:100%;object-fit:cover}
.pp-pen{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.88);color:#444;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:none}
.crop-more{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;color:rgba(255,255,255,.45)}
.crop-more button{border:0;background:none;color:rgba(255,255,255,.85);font-size:14px;font-weight:600;padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
.crop-more #cDel{color:#FFB3B3}
.crop-btns{display:flex;gap:8px;width:min(86vw,360px)}.crop-btns .btn{flex:1;min-height:46px;padding:10px}
.crop-btns .btn.ghost{color:#F7C7D2;border-color:rgba(247,199,210,.5)}
.pp-btns button{font-size:14px}
.ver{text-align:center;font-size:11px;color:#9C7C84;opacity:.75;margin:0 0 6px;letter-spacing:.04em}
/* 검색 */
.topbtns{display:flex;gap:8px}
.sheet.tall{max-height:88vh;max-height:88dvh}
.sr-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;color:var(--muted);margin:6px 0 12px}
.sr-box:focus-within{border-color:var(--wine3)}
.sr-box input{flex:1;border:0;outline:0;background:none;padding:12px 0;font-size:16px;min-width:0}
.sr-hint{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 8px}
.sr-chips{display:flex;flex-wrap:wrap;gap:8px}
.sr-chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--wine)}
.sr-sec{margin:14px 0 4px}
.sr-sec h3{font-size:14px;color:var(--muted);margin:0 0 6px}.sr-sec h3 span{color:var(--wine3);margin-left:4px}
.sr-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;margin:6px 0;color:var(--ink)}
.sr-row .g{flex:none;width:34px;height:40px;border-radius:10px;background:var(--cream);display:grid;place-items:center;font-size:18px}
.sr-row .g.lv{font-size:12px;font-weight:800;color:var(--wine);width:40px}
.sr-row .tx{flex:1;min-width:0}
.sr-row .tx b{display:block;font-size:15px;line-height:1.35}
.sr-row .tx small{display:block;font-size:12px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-row svg{flex:none;color:var(--muted)}
.sr-empty{text-align:center;color:var(--muted);padding:22px 8px 12px;font-size:15px}
.sr-foot{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 6px}
.sr-ext{display:flex;gap:8px}.sr-ext .btn{flex:1;min-height:42px;padding:8px;font-size:14px;text-decoration:none}
.sr-back{margin:0 0 6px;color:var(--muted)!important}
.sr-style{background:#FBF7F1;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.sr-prod .tier{display:inline-block;vertical-align:middle}
.sheet .link{color:var(--wine)}
/* 기록 창: 세로 사진 + 옆 정보 */
.rec-top{display:grid;grid-template-columns:42% minmax(0,1fr);gap:12px;align-items:start;margin:14px 0}
.rt-side{min-width:0}
.rt-side .field{margin:0 0 10px}
.rt-side .field:last-child{margin-bottom:0}
.rt-side .starpick{gap:2px}
.rt-side .starpick button{font-size:22px;padding:0 1px}
.rt-side input[type=date]{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:9px 6px;font-size:14px;min-height:40px;text-align:left}
.rt-side input[type=date]::-webkit-date-and-time-value{text-align:left}
.rt-side input[type=date]::-webkit-calendar-picker-indicator{margin-left:2px;padding:0}
.rt-side .price-in button{width:32px;font-size:14px}
.rt-side .price-in input{padding:8px 6px;font-size:14px;width:100%;box-sizing:border-box}
.photo-pick.v{position:relative;aspect-ratio:3/4;display:flex}
.photo-pick.v img{width:100%;height:100%;max-height:none;object-fit:cover}
.photo-pick.v .pp-empty{height:100%;justify-content:center;padding:10px;font-size:14px}
.photo-pick.v .pp-empty small{font-size:12px;font-weight:500;color:var(--muted)}
.photo-pick.v .pp-btns{position:absolute;left:6px;right:6px;bottom:6px;border:0;gap:4px;background:none}
.photo-pick.v .pp-btns button{flex:1;padding:6px 0;font-size:11.5px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--wine);border:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.photo-pick.v .pp-btns button+button{border-left:0;color:var(--wine)}
.photo-pick.v .pp-btns #ppDel{color:#A3273A}
.rec .g.has{width:46px;height:60px}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- 저장소 (사용할 수 없을 때는 메모리에 보관) ---------- */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem('winepick_'+k);if(v!=null)return JSON.parse(v);}catch(e){}return (k in mem)?mem[k]:d;},
  set(k,v){mem[k]=v;try{localStorage.setItem('winepick_'+k,JSON.stringify(v));}catch(e){}}
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const view=$('#view');

function defaultCurrency(){
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';if(tz==='Asia/Seoul')return 'KRW';}catch(e){}
  try{if((navigator.language||'').toLowerCase()==='ko-kr')return 'KRW';}catch(e){}
  return 'USD';
}
let settings=store.get('settings',null)||{currency:defaultCurrency()};

/* ---------- 데이터 ---------- */
const TYPES={
  red:{label:'레드',color:'#B30737'},
  white:{label:'화이트',color:'#E4CF72'},

};
const PRICE={
  KRW:{1:'2만 원 이하',2:'2~5만 원',3:'5만 원 이상'},
  USD:{1:'$15 이하',2:'$15~30',3:'$30 이상'}
};

const FOODSHORT={meat:'고기 요리',seafood:'해산물',chicken:'닭요리',pizza:'피자·파스타',spicy:'매운 음식',cheese:'치즈·안주',dessert:'디저트'};

// s 단맛, a 신맛, t 떫은맛(탄닌), b 바디감 (0~5)
const WINES=[
 {id:'cab-chile',name:'칠레 카베르네 소비뇽',type:'red',grape:'카베르네 소비뇽',s:1,a:3,t:4,b:4,price:[1,2],food:['meat','cheese'],occ:['alone','party'],aroma:'블랙베리, 체리, 살짝 초콜릿',desc:'진하고 묵직한 레드의 대표예요. 칠레산은 값에 비해 맛이 좋아서 처음 고르기 좋아요.',temp:'16~18°C',ex:'카시예로 델 디아블로(Casillero del Diablo)'},
 {id:'cab-cal',name:'캘리포니아 카베르네 소비뇽',type:'red',grape:'카베르네 소비뇽',s:1,a:3,t:4,b:5,price:[2,3],food:['meat','cheese'],occ:['gift','date'],aroma:'잘 익은 블랙베리, 바닐라, 오크 향',desc:'과일 맛이 풍부하고 아주 묵직해요. 스테이크와 함께라면 실패가 거의 없어요.',temp:'16~18°C',ex:'조쉬 셀러(Josh Cellars), 켄달 잭슨(Kendall-Jackson)'},
 {id:'pinot',name:'피노 누아',type:'red',grape:'피노 누아',s:1,a:4,t:2,b:2,price:[2,3],food:['chicken','seafood','pizza','cheese'],occ:['date','gift'],aroma:'딸기, 체리, 버섯, 흙 내음',desc:'떫은맛이 적고 가벼운 레드예요. 레드가 처음이라면 가장 편하게 시작할 수 있어요. 연어와도 잘 맞아요.',temp:'13~15°C',ex:'미국 오리건이나 캘리포니아산, 프랑스 부르고뉴(Bourgogne)산'},
 {id:'merlot',name:'메를로',type:'red',grape:'메를로',s:1,a:3,t:3,b:3,price:[1,2],food:['pizza','chicken','meat'],occ:['alone','party'],aroma:'자두, 체리, 부드러운 초콜릿',desc:'카베르네보다 부드럽고 둥근 맛이에요. 누구나 무난하게 좋아하는 레드예요.',temp:'15~17°C',ex:'칠레나 미국 캘리포니아산'},
 {id:'malbec',name:'아르헨티나 말벡',type:'red',grape:'말벡',s:1,a:3,t:4,b:4,price:[1,2],food:['meat'],occ:['party','alone'],aroma:'자두, 블루베리, 제비꽃',desc:'진하지만 부드러워서 고기, 특히 바비큐와 찰떡이에요. 가성비가 좋아요.',temp:'16~18°C',ex:'카테나(Catena), 알라모스(Alamos)'},
 {id:'shiraz',name:'호주 쉬라즈',type:'red',grape:'쉬라즈(시라)',s:2,a:3,t:4,b:5,price:[1,2],food:['meat','pizza'],occ:['party'],aroma:'블랙베리 잼, 후추, 스모키',desc:'과일 잼처럼 진하고 살짝 후추 향이 나요. 양념 갈비, 바비큐에 잘 어울려요.',temp:'16~18°C',ex:'옐로우 테일(Yellow Tail), 펜폴즈(Penfolds)'},
 {id:'chianti',name:'이탈리아 키안티',type:'red',grape:'산지오베제',s:1,a:4,t:3,b:3,price:[1,2],food:['pizza','meat','cheese'],occ:['party','date'],aroma:'체리, 토마토 잎, 허브',desc:'산미가 살아 있어서 토마토 소스와 아주 잘 맞아요. 피자·파스타 와인의 정석이에요.',temp:'15~17°C',ex:'라벨에 Chianti 또는 Chianti Classico 표시'},
 {id:'rioja',name:'스페인 리오하',type:'red',grape:'템프라니요',s:1,a:3,t:3,b:4,price:[2,3],food:['meat','cheese'],occ:['gift','party'],aroma:'체리, 바닐라, 가죽',desc:'오크통에서 숙성해 부드럽고 은은한 바닐라 향이 나요. 라벨의 Crianza·Reserva는 숙성 기간이에요.',temp:'16~18°C',ex:'캄포 비에호(Campo Viejo), 마르케스 데 리스칼(Marqués de Riscal)'},
 {id:'zin',name:'캘리포니아 진판델',type:'red',grape:'진판델',s:2,a:3,t:3,b:4,price:[1,2],food:['pizza','meat','spicy'],occ:['party','alone'],aroma:'라즈베리 잼, 블랙베리, 향신료',desc:'과일 맛이 진하고 살짝 달게 느껴져요. 바비큐, 버거, 피자 같은 편한 음식과 좋아요.',temp:'15~17°C',ex:'라벨에 Zinfandel 표시 (분홍색 White Zinfandel과는 달라요)'},
 {id:'sb-nz',name:'뉴질랜드 소비뇽 블랑',type:'white',grape:'소비뇽 블랑',s:1,a:5,t:0,b:2,price:[1,2],food:['seafood','chicken','cheese','none'],occ:['alone','party'],aroma:'자몽, 라임, 풋풋한 풀 향, 패션프루트',desc:'아주 상큼하고 향이 톡 쏘는 화이트예요. 회, 샐러드, 해산물과 잘 맞아요.',temp:'7~10°C',ex:'킴 크로포드(Kim Crawford), 빌라 마리아(Villa Maria)'},
 {id:'chard-cal',name:'캘리포니아 샤르도네',type:'white',grape:'샤르도네',s:1,a:3,t:0,b:4,price:[2],food:['chicken','seafood','pizza'],occ:['date','alone'],aroma:'사과, 파인애플, 버터, 바닐라',desc:'오크통 숙성으로 버터처럼 부드럽고 묵직한 화이트예요. 크림 파스타, 구운 닭에 좋아요.',temp:'10~12°C',ex:'켄달 잭슨(Kendall-Jackson), 라 크레마(La Crema)'},
 {id:'chablis',name:'프랑스 샤블리',type:'white',grape:'샤르도네',s:1,a:4,t:0,b:2,price:[2,3],food:['seafood'],occ:['gift','date'],aroma:'청사과, 레몬, 미네랄(돌) 느낌',desc:'같은 샤르도네지만 깔끔하고 상큼해요. 굴, 회, 조개 요리와 최고의 짝이에요.',temp:'8~10°C',ex:'라벨에 Chablis 표시'},
 {id:'riesling',name:'독일 리슬링',type:'white',grape:'리슬링',s:3,a:5,t:0,b:2,price:[1,2],food:['spicy','chicken','seafood'],occ:['alone','date'],aroma:'복숭아, 살구, 라임, 꽃',desc:'살짝 달콤하고 아주 상큼해요. 매운 음식의 열기를 식혀 줘서 떡볶이, 태국·중국 요리와 좋아요.',temp:'7~10°C',ex:'라벨에 Kabinett(살짝 단맛) 표시, 닥터 루젠(Dr. Loosen)'},
 {id:'pg',name:'이탈리아 피노 그리지오',type:'white',grape:'피노 그리지오',s:1,a:3,t:0,b:1,price:[1],food:['seafood','chicken','none'],occ:['alone','party'],aroma:'레몬, 배, 청사과',desc:'가볍고 깔끔해서 물처럼 술술 넘어가요. 와인이 낯선 사람에게 부담 없는 화이트예요.',temp:'7~10°C',ex:'산타 마르게리타(Santa Margherita), 에코 도마니(Ecco Domani)'},
 {id:'rose',name:'프로방스 로제',type:'rose',grape:'그르나슈·생소 블렌드',s:1,a:4,t:1,b:2,price:[2],food:['seafood','chicken','cheese','none','spicy'],occ:['party','date','alone'],aroma:'딸기, 수박, 복숭아, 꽃',desc:'연한 분홍빛에 달지 않고 상큼해요. 거의 모든 음식과 어울려서 고민될 때 좋아요.',temp:'8~10°C',ex:'위스퍼링 엔젤(Whispering Angel), 라벨에 Côtes de Provence 표시'},
 {id:'prosecco',name:'이탈리아 프로세코',type:'sparkling',grape:'글레라',s:2,a:4,t:0,b:1,price:[1],food:['none','chicken','cheese','seafood'],occ:['party','alone'],aroma:'청사과, 배, 꽃',desc:'가볍고 상큼한 거품 와인이에요. 샴페인보다 값이 착해서 파티나 건배용으로 딱이에요.',temp:'6~8°C',ex:'라 마르카(La Marca), 미오네토(Mionetto). Brut는 덜 달고 Extra Dry는 살짝 달아요'},
 {id:'cava',name:'스페인 카바',type:'sparkling',grape:'마카베오 외',s:1,a:4,t:0,b:2,price:[1],food:['chicken','seafood','none'],occ:['party'],aroma:'레몬, 사과, 토스트',desc:'샴페인과 같은 방식으로 만든 가성비 스파클링이에요. 치킨이나 튀김과 정말 잘 맞아요.',temp:'6~8°C',ex:'프레시넷(Freixenet)'},
 {id:'champagne',name:'프랑스 샴페인',type:'sparkling',grape:'샤르도네·피노 누아',s:1,a:5,t:0,b:3,price:[3],food:['seafood','chicken','none'],occ:['gift','date','party'],aroma:'레몬, 사과, 갓 구운 빵, 견과',desc:'프랑스 샹파뉴 지역에서만 만드는 스파클링이에요. 축하하는 날, 선물로 가장 확실해요.',temp:'7~9°C',ex:'모엣 샹동(Moët & Chandon), 뵈브 클리코(Veuve Clicquot)'},
 {id:'moscato',name:'모스카토 다스티',type:'sparkling',grape:'모스카토',s:5,a:3,t:0,b:1,price:[1],food:['dessert','spicy','none'],occ:['alone','date'],aroma:'복숭아, 청포도, 꿀, 꽃',desc:'달콤하고 살짝 톡 쏘는 와인이에요. 도수가 5% 정도로 낮아서 술이 약한 사람도 즐기기 좋아요.',temp:'6~8°C',ex:"라벨에 Moscato d'Asti 표시"},
 {id:'brachetto',name:'브라케토 다퀴',type:'sparkling',grape:'브라케토',s:4,a:3,t:1,b:1,price:[1,2],food:['dessert','none'],occ:['date','party'],aroma:'딸기, 장미, 라즈베리',desc:'붉은빛의 달콤한 거품 와인이에요. 초콜릿, 딸기 케이크와 함께하면 분위기가 살아나요.',temp:'6~8°C',ex:"라벨에 Brachetto d'Acqui 표시"},
 {id:'port',name:'포트 와인',type:'dessert',grape:'포르투갈 토착 품종',s:5,a:2,t:3,b:5,price:[2,3],food:['dessert','cheese'],occ:['gift','alone'],aroma:'건포도, 캐러멜, 초콜릿, 견과',desc:'달고 진하며 도수가 20% 정도로 높아요. 작은 잔에 조금씩, 초콜릿이나 블루치즈와 마셔요. 열고 나서도 몇 주 보관돼요.',temp:'14~16°C',ex:"그레이엄스(Graham's), 테일러스(Taylor's)"},
 {id:'beaujolais',name:'프랑스 보졸레',type:'red',grape:'가메',s:1,a:4,t:1,b:2,price:[1,2],food:['chicken','pizza','cheese','none'],occ:['alone','party'],aroma:'딸기, 라즈베리, 체리, 꽃',desc:'가볍고 과일 향이 풍부한 레드예요. 살짝 시원하게 마시면 더 맛있어요. 매년 11월에 나오는 햇와인 보졸레 누보도 여기 속해요.',temp:'12~14°C',ex:'라벨에 Beaujolais-Villages, Morgon, Fleurie 같은 마을 이름'},
 {id:'barolo',name:'이탈리아 바롤로·네비올로',type:'red',grape:'네비올로',s:1,a:5,t:5,b:4,price:[2,3],food:['meat','cheese'],occ:['gift','date'],aroma:'장미, 체리, 타르, 감초',desc:'"와인의 왕"이라 불리는 피에몬테의 명품 레드예요. 색은 연한데 떫은맛과 산미가 아주 강해서 숙성할수록 좋아져요. 부담되면 랑게 네비올로부터 시작해 보세요.',temp:'16~18°C',ex:'라벨에 Barolo, Barbaresco, Langhe Nebbiolo'},
 {id:'rhone',name:'프랑스 론 레드 블렌드',type:'red',grape:'그르나슈·시라 블렌드',s:1,a:3,t:3,b:4,price:[1,2,3],food:['meat','pizza','cheese'],occ:['party','alone','gift'],aroma:'라즈베리, 후추, 허브',desc:'프랑스 남부 론의 따뜻하고 부드러운 블렌드 레드예요. 코트 뒤 론은 가성비 데일리 와인, 샤토뇌프 뒤 파프는 특별한 날 와인이에요.',temp:'16~18°C',ex:'라벨에 Côtes du Rhône, Châteauneuf-du-Pape, Crozes-Hermitage'},
 {id:'bordeaux',name:'프랑스 보르도 레드',type:'red',grape:'카베르네·메를로 블렌드',s:1,a:3,t:4,b:4,price:[1,2,3],food:['meat','cheese'],occ:['gift','date'],aroma:'블랙커런트, 삼나무, 흑연',desc:'여러 품종을 섞어 만드는 클래식 레드의 기준이에요. 라벨에 품종 대신 샤토(Château) 이름이 크게 적혀 있어요.',temp:'16~18°C',ex:'라벨에 Bordeaux, Médoc, Saint-Émilion'},
 {id:'ribera',name:'스페인 리베라 델 두에로',type:'red',grape:'템프라니요',s:1,a:3,t:4,b:5,price:[2,3],food:['meat'],occ:['gift','party'],aroma:'블랙베리, 자두, 오크, 감초',desc:'같은 템프라니요라도 리오하보다 더 진하고 힘 있는 스타일이에요. 스페인 내륙 고지대의 큰 일교차가 만든 맛이에요.',temp:'16~18°C',ex:'라벨에 Ribera del Duero'},
 {id:'carmenere',name:'칠레 카르메네르',type:'red',grape:'카르메네르',s:1,a:3,t:3,b:4,price:[1,2],food:['meat','pizza'],occ:['alone','party'],aroma:'블랙베리, 피망, 후추, 초콜릿',desc:'원래 보르도 품종이지만 지금은 칠레를 대표하는 레드예요. 부드러운 탄닌에 살짝 풋고추 같은 향이 특징이에요.',temp:'16~18°C',ex:'라벨에 Carmenère'},
 {id:'amarone',name:'이탈리아 아마로네·리파소',type:'red',grape:'코르비나 블렌드',s:2,a:3,t:4,b:5,price:[2,3],food:['meat','cheese'],occ:['gift','alone'],aroma:'말린 체리, 건포도, 초콜릿',desc:'포도를 몇 달 동안 말려서 만드는 베네토의 진한 레드예요. 리파소(Ripasso)는 아마로네 찌꺼기로 한 번 더 숙성한, 더 가볍고 값도 착한 동생이에요.',temp:'16~18°C',ex:'라벨에 Amarone della Valpolicella, Ripasso'},
 {id:'brunello',name:'이탈리아 브루넬로 디 몬탈치노',type:'red',grape:'산지오베제',s:1,a:4,t:4,b:4,price:[2,3],food:['meat','cheese'],occ:['gift','date'],aroma:'체리, 가죽, 허브, 담배',desc:'토스카나 몬탈치노에서 산지오베제로만 만드는 명품 레드예요. 출시 전에 오래 숙성해요. 로소 디 몬탈치노는 더 어리고 가벼운 동생이에요.',temp:'16~18°C',ex:'라벨에 Brunello di Montalcino, Rosso di Montalcino'},
 {id:'sancerre',name:'프랑스 상세르·푸이 퓌메',type:'white',grape:'소비뇽 블랑',s:1,a:5,t:0,b:2,price:[2,3],food:['seafood','cheese'],occ:['date','gift'],aroma:'레몬, 자몽, 부싯돌 같은 미네랄',desc:'프랑스 루아르의 소비뇽 블랑이에요. 뉴질랜드보다 향이 차분하고 미네랄 느낌이 강해요. 염소 치즈와 최고의 짝이에요.',temp:'8~10°C',ex:'라벨에 Sancerre, Pouilly-Fumé'},
 {id:'albarino',name:'스페인 알바리뇨',type:'white',grape:'알바리뇨',s:1,a:5,t:0,b:2,price:[1,2],food:['seafood','none'],occ:['alone','party'],aroma:'복숭아, 레몬, 바다 내음',desc:'스페인 북서쪽 리아스 바이샤스의 상큼한 화이트예요. 짭조름한 느낌이 있어 회, 조개, 해산물 요리와 아주 잘 맞아요.',temp:'8~10°C',ex:'라벨에 Albariño, Rías Baixas'},

  return `<svg width="${w}" height="${w*1.2}" viewBox="0 0 34 41" aria-hidden="true"><path d="M5 2h24c0 13-4 21-12 21S5 15 5 2z" fill="#fff" stroke="#CDB9AE" stroke-width="1"/><path d="M6.2 10h21.6c-1 8-4.7 13-10.8 13S7.2 18 6.2 10z" fill="${c}"/><path d="M17 23v13M11 39h12" stroke="#CDB9AE" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
function bar(n){let h='';for(let i=1;i<=5;i++)h+=`<i class="${i<=Math.round(n)?'on':''}"></i>`;return `<div class="bar">${h}</div>`;}
function tasteBlock(o,isWine){
  const rows=[['단맛',o.s],['신맛',o.a],['떫은맛',o.t],['바디감',o.b]];
  return `<div class="taste">${rows.map(([k,v])=>`<span>${k}</span>${bar(v)}`).join('')}</div>`;
}
function stars(n){return '★★★★★'.slice(0,n)+'<span style="color:#E3D6CC">'+'★★★★★'.slice(0,5-n)+'</span>';}
const chev='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';

  tip:'시라와 쉬라즈처럼 나라마다 이름이 다른 품종이 있어요. 라벨에서 둘 중 하나를 보면 같은 품종이라고 생각하면 돼요.'},
 {k:'4. 오크와 숙성 · Oak & Aging',t:'나무통이 맛을 바꿔요',
  art:()=>`<svg width="96" height="84" viewBox="0 0 96 84" aria-hidden="true"><ellipse cx="48" cy="42" rx="40" ry="38" fill="#9A6538"/><path d="M14 22h68M10 42h76M14 62h68" stroke="#5E3A1E" stroke-width="4"/><ellipse cx="48" cy="42" rx="40" ry="38" fill="none" stroke="#5E3A1E" stroke-width="3"/><path d="M30 6v72M66 6v72" stroke="#7A4A28" stroke-width="1.5" opacity=".6"/></svg><div style="display:flex;flex-direction:column;gap:6px">${tile('바닐라','Vanilla')}${tile('토스트','Toast')}${tile('코코넛','Coconut')}</div>`,
  b:`<ul class="list">
  <li><b>오크 숙성</b>${EN('Oak Aging')} — 와인을 나무통에 넣어 두면 바닐라, 토스트, 향신료 향이 생기고 맛이 둥글어져요.</li>
  <li><b>프랑스 오크 vs 미국 오크</b>${EN('French vs American Oak')} — 프랑스 오크는 은은한 향신료, 미국 오크는 코코넛·딜 같은 달콤한 향이 더 진해요.</li>
  <li><b>새 통 vs 헌 통</b> — 새 통일수록 나무 향이 강해요. 헌 통은 향은 약하지만 맛을 부드럽게 해 줘요.</li>
  <li><b>오크 없는 와인</b>${EN('Unoaked')} — 스테인리스 통에서 만들어 과일 맛이 깨끗하고 상큼해요. 샤블리, 소비뇽 블랑이 대표예요.</li>
  <li><b>빈티지</b>${EN('Vintage')} — 포도를 딴 해예요. 날씨가 해마다 다른 서늘한 산지(보르도, 부르고뉴)일수록 빈티지 차이가 커요.</li></ul>`,
  tip:'"버터 같은 샤르도네"와 "상큼한 샤르도네"의 차이는 대부분 오크예요. 라벨에 Unoaked가 있으면 상큼한 쪽이에요.'},
 {k:'5. 스파클링 단맛 읽기 · Sparkling Sweetness',t:'Extra Dry가 Brut보다 달아요',
  art:()=>`<div style="width:100%"><div style="height:10px;border-radius:5px;background:linear-gradient(90deg,#F4EADA,#E9C77A,#C9873A)"></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;font-size:11.5px;font-weight:700;color:#6B1E2E;text-align:center;line-height:1.3"><span>Brut Nature<br><span class="en" style="margin:0">가장 드라이</span></span><span>Brut<br><span class="en" style="margin:0">드라이</span></span><span>Extra Dry<br><span class="en" style="margin:0">살짝 달콤</span></span><span>Demi-Sec<br><span class="en" style="margin:0">달콤</span></span></div></div>`,
  b:`<ul class="list">
  <li><b>브뤼 나튀르</b>${EN('Brut Nature · Zero')} — 단맛이 거의 없어요. 아주 깔끔해요.</li>
  <li><b>브뤼</b>${EN('Brut')} — 가장 흔한 드라이 스파클링이에요. 샴페인, 카바 대부분이 브뤼예요.</li>
  <li><b>엑스트라 드라이</b>${EN('Extra Dry')} — 이름과 달리 <b>브뤼보다 조금 더 달아요.</b> 프로세코에 많아요.</li>
  <li><b>섹 · 드미섹</b>${EN('Sec · Demi-Sec')} — 점점 달콤해져요. 드미섹은 디저트와 잘 맞아요.</li>
  <li><b>두</b>${EN('Doux')} — 가장 달콤한 단계예요.</li></ul>`,
  tip:'"드라이"라는 말이 들어 있어도 스파클링에서는 브뤼가 더 드라이해요. 달지 않은 걸 원하면 Brut를 찾으세요.'},
 {k:'6. 테이스팅 4단계 · How to Taste',t:'보고, 돌리고, 맡고, 마셔요',
  art:()=>grid(4,[['1','보기','See'],['2','돌리기','Swirl'],['3','맡기','Smell'],['4','마시기','Sip']].map(([n,a,e])=>`<div style="background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;font-weight:700;line-height:1.3"><span class="pin" style="margin-bottom:4px">${n}</span><br>${a}<br><span class="en" style="margin:0">${e}</span></div>`)),
  b:`<ul class="list">
  <li><b>보기</b>${EN('See')} — 흰 종이 위에서 색을 봐요. 레드는 오래될수록 벽돌색, 화이트는 금빛으로 변해요.</li>
  <li><b>돌리기</b>${EN('Swirl')} — 잔을 테이블에 대고 살살 돌려요. 공기와 만나서 향이 깨어나요.</li>
  <li><b>맡기</b>${EN('Smell')} — 코를 잔 안에 넣고 짧게 여러 번 맡아요. 과일, 꽃, 나무 중 무엇이 떠오르는지 생각해 봐요.</li>
  <li><b>마시기</b>${EN('Sip')} — 한 모금을 입안 전체에 굴리고 삼킨 뒤, 맛이 얼마나 오래 남는지(여운)${EN('Finish')} 느껴 봐요.</li>
  <li><b>디캔팅</b>${EN('Decanting')} — 다른 병(디캔터)에 옮겨 공기와 만나게 해요. 어리고 떫은 레드는 부드러워지고, 오래된 와인은 찌꺼기를 거를 수 있어요.</li></ul>`,
  tip:'여운이 길수록 대체로 좋은 와인이에요. 삼킨 뒤 속으로 천천히 숫자를 세어 보세요.'}
];
const LEARN_ADV=[
 {k:'1. 테루아 · Terroir',t:'땅과 하늘과 사람이 만드는 맛',
  art:()=>`<svg width="120" height="70" viewBox="0 0 120 70" aria-hidden="true"><circle cx="96" cy="16" r="9" fill="#E9C77A"/><path d="M0 52C20 30 40 28 60 40S100 30 120 44V70H0z" fill="#6E8B4E"/><path d="M0 60C30 50 70 56 120 54V70H0z" fill="#8A5A34"/><g fill="#8E2C3E"><circle cx="34" cy="38" r="2.2"/><circle cx="44" cy="36" r="2.2"/><circle cx="54" cy="38" r="2.2"/><circle cx="74" cy="38" r="2.2"/><circle cx="84" cy="36" r="2.2"/></g></svg>${grid(3,[tile('땅','Soil'),tile('기후','Climate'),tile('사람','Human')])}`,
  b:`<ul class="list">
  <li><b>테루아</b>${EN('Terroir')} — 포도가 자란 곳의 모든 환경을 말해요. 같은 품종도 테루아가 다르면 맛이 달라져요.</li>
  <li><b>땅</b>${EN('Soil')} — 석회암 땅은 산미가 살아 있는 우아한 와인, 자갈 땅은 물 빠짐이 좋아 진한 와인이 되기 쉬워요.</li>
  <li><b>기후</b>${EN('Climate')} — 서늘하면 산미가 높고 가벼운 와인, 더우면 과일 맛과 알코올이 높은 와인이 돼요.</li>
  <li><b>사람</b>${EN('Human')} — 언제 수확할지, 어떤 통에서 숙성할지 같은 만드는 사람의 선택도 테루아에 포함돼요.</li></ul>`,
  tip:'유럽 와인이 품종보다 지역 이름을 앞세우는 이유가 바로 테루아예요. "어디서 났는지가 곧 맛"이라고 보기 때문이에요.'},
 {k:'2. 등급 체계 · Classifications',t:'라벨 속 등급 읽기',
  art:()=>grid(3,[tile('프랑스','AOC · Grand Cru'),tile('이탈리아','DOCG > DOC'),tile('스페인','Reserva')]),
  b:`<ul class="list">
  <li><b>프랑스 AOC</b>${EN('AOC · AOP')} — 정해진 지역과 규칙을 지켜 만든 와인이에요. 부르고뉴는 <b>그랑 크뤼</b>${EN('Grand Cru')} → <b>프르미에 크뤼</b>${EN('Premier Cru')} → 마을 → 지역 순이에요. 보르도에는 1855년에 정한 1~5등급 샤토 등급이 있어요.</li>
  <li><b>이탈리아</b> — <b>DOCG</b> → <b>DOC</b> → <b>IGT</b> 순이에요. 다만 IGT 중에도 '슈퍼 투스칸'처럼 비싼 명품 와인이 있어요.</li>
  <li><b>스페인 리오하 레드</b> — 숙성 기간으로 나눠요. <b>크리안사</b>${EN('Crianza')} 최소 2년(오크 1년), <b>레세르바</b>${EN('Reserva')} 3년(오크 1년), <b>그란 레세르바</b>${EN('Gran Reserva')} 5년(오크 2년)이에요.</li>
  <li><b>독일</b> — 포도가 얼마나 잘 익었는지로 나눠요. 카비넷${EN('Kabinett')} → 슈페트레제${EN('Spätlese')} → 아우스레제${EN('Auslese')} 순으로 진하고 달콤해지는 경우가 많아요.</li></ul>`,
  tip:'등급이 높다고 내 입에 꼭 맞는 건 아니에요. 등급은 "규칙을 지켰다"는 뜻이지, "맛있다"는 보증은 아니에요.'},
 {k:'3. 향의 3단계 · Aroma Layers',t:'향은 세 곳에서 와요',
  art:()=>`<div style="width:100%;display:grid;gap:6px">${[['1차 향','Primary','포도 — 과일, 꽃, 허브'],['2차 향','Secondary','양조 — 빵, 버터, 바닐라'],['3차 향','Tertiary','숙성 — 가죽, 버섯, 견과, 꿀']].map(([a,e,d])=>`<div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:7px 10px;font-size:13px"><b style="min-width:52px">${a}</b><span class="en" style="margin:0;min-width:66px">${e}</span><span style="color:#5a4a44">${d}</span></div>`).join('')}</div>`,
  b:`<ul class="list">
  <li><b>1차 향</b>${EN('Primary')} — 포도 자체에서 와요. 체리, 레몬, 장미, 풀 같은 향이에요. 어린 와인에서 가장 진해요.</li>
  <li><b>2차 향</b>${EN('Secondary')} — 만드는 과정에서 생겨요. 효모에서 빵·비스킷 향, 젖산 발효에서 버터 향, 오크통에서 바닐라·토스트 향이 나요.</li>
  <li><b>3차 향</b>${EN('Tertiary')} — 병이나 통에서 오래 숙성하며 생겨요. 가죽, 버섯, 담배, 견과, 꿀, 말린 과일 향이에요.</li></ul>`,
  tip:'오래된 와인에서 과일 향 대신 버섯·가죽 향이 난다면 상한 게 아니라 잘 숙성된 거예요.'},
 {k:'4. 와인 결점 알아보기 · Wine Faults',t:'상한 와인 구별하기',
  art:()=>grid(2,[tile('코르크 오염','Cork Taint · TCA','border:2px solid #E7B7BE'),tile('산화','Oxidation','border:2px solid #E9C77A')]),
  b:`<ul class="list">
  <li><b>코르크 오염</b>${EN('Cork Taint · TCA')} — 젖은 신문지, 곰팡이 핀 지하실 냄새가 나고 과일 향이 죽어 있어요. 코르크 속 물질 때문에 생겨요.</li>
  <li><b>산화</b>${EN('Oxidation')} — 공기를 너무 많이 만나 색이 갈색으로 변하고, 사과 썩은 냄새나 김빠진 맛이 나요.</li>
  <li><b>열 손상</b>${EN('Heat Damage')} — 뜨거운 곳에 둬서 졸인 잼 같은 맛이 나요. 코르크가 위로 밀려 나와 있으면 의심해 보세요.</li>
  <li><b>결점이 아닌 것</b> — 병 바닥의 찌꺼기${EN('Sediment')}나 코르크에 붙은 하얀 결정${EN('Tartrate')}은 자연스러운 거라 마셔도 괜찮아요.</li></ul>`,
  tip:'레스토랑에서는 와인에 결점이 있을 때 바꿔 달라고 할 수 있어요. 단, 단순히 입맛에 안 맞는 건 이유가 되지 않아요.'},
 {k:'5. 보관과 숙성 · Storage & Aging',t:'와인을 오래 맛있게 두는 법',
  art:()=>grid(2,[tile('눕혀서','Lay it down'),tile('12~14°C','Cool & steady'),tile('어둡게','Dark'),tile('흔들림 없이','No vibration')]),
  b:`<ul class="list">
  <li><b>눕혀서</b>${EN('Lay it down')} — 코르크 마개 와인은 눕혀야 코르크가 마르지 않아요. 스크류캡은 세워 둬도 돼요.</li>
  <li><b>서늘하고 일정하게</b> — 12~14°C 정도에서 온도가 자주 바뀌지 않는 곳이 좋아요. 주방이나 냉장고 위는 피하세요.</li>
  <li><b>어둡고 조용하게</b> — 햇빛과 진동은 와인을 빨리 망가뜨려요.</li>
  <li><b>대부분은 바로 마시는 와인</b> — 시중 와인의 대부분은 사고 몇 년 안에 마시도록 만들어요.</li>
  <li><b>오래 둘수록 좋아지는 와인</b> — 떫은맛·산미·단맛이 강한 와인이에요. 보르도, 바롤로, 독일 리슬링, 포트, 소테른이 대표예요.</li></ul>`,
  tip:'와인 냉장고가 없다면 옷장 바닥처럼 어둡고 서늘한 곳에 눕혀 두는 것만으로도 충분해요.'},
 {k:'6. 레스토랑에서 주문하기 · Ordering Wine',t:'소믈리에와 편하게 대화하기',
  art:()=>grid(3,[tile('예산 말하기','Budget'),tile('라벨 확인','Check label'),tile('맛보기','Taste')]),
  b:`<ul class="list">
  <li><b>와인 리스트</b>${EN('Wine List')} — 보통 스파클링 → 화이트 → 레드 → 디저트 와인 순이고, 그 안에서 나라나 지역별로 나뉘어 있어요.</li>
  <li><b>예산 말하기</b> — 리스트의 가격을 손가락으로 가리키며 "이 정도에서 추천해 주세요"라고 하면 자연스럽게 예산을 전할 수 있어요.</li>
  <li><b>라벨 확인</b> — 병을 보여 주면 이름과 빈티지가 주문한 것과 같은지 봐요.</li>
  <li><b>첫 맛보기</b>${EN('Tasting')} — 조금 따라 주는 건 <b>결점이 없는지</b> 확인하는 거예요. 향을 맡고 괜찮으면 "좋아요"라고 하면 돼요. 코르크 냄새는 맡지 않아도 돼요.</li>
  <li><b>잔 잡기</b> — 잔의 다리를 잡으면 와인이 손 온도로 데워지지 않아요.</li>
  <li><b>콜키지</b>${EN('Corkage')} — 와인을 가져가서 마실 때 내는 요금이에요. 가능한지 미리 물어보세요.</li></ul>`,
  tip:'소믈리에에게 "가볍고 상큼한 화이트", "부드러운 레드"처럼 이 앱에서 배운 말로 원하는 맛을 설명해 보세요.'}
];

function targetOf(ans){
  let s=2,a=3,t=3,b=3;
  if(ans.coffee==='black'){s=1;t=3.5}
  else if(ans.coffee==='latte'){s=2;t=2.5}
  else if(ans.coffee==='sweet'){s=4;t=2}
  a={love:4.5,ok:3.2,no:2}[ans.sour]||3;
  if(ans.body==='heavy'){b=4.5;t=Math.max(t,4)}
  else if(ans.body==='light'){b=1.5;t=Math.min(t,1.5)}
  return {s,a,t,b};
}
function recommend(ans){
  const T=targetOf(ans);
  const recs=store.get('records',[]);
  const liked=recs.filter(r=>r.style&&WMAP[r.style]&&r.rating>=4).map(r=>r.style);
  const disliked=recs.filter(r=>r.style&&WMAP[r.style]&&r.rating<=2).map(r=>r.style);
  const budget=+ans.budget||0;
  const scored=WINES.map(w=>{
    let d=Math.abs(w.s-T.s)*1.3+Math.abs(w.a-T.a)+Math.abs(w.b-T.b);
    d+= w.t>T.t ? (w.t-T.t)*0.9 : (T.t-w.t)*0.35;
    let sc=10-d;const why=[];
    // 종류
    if(ans.type&&ans.type!=='any'){ if(w.type===ans.type) sc+=3.5; else sc-=5; }
    // 음식
    if(ans.food&&ans.food!=='none'){
      if(w.food.includes(ans.food)){sc+=3;why.push(`${FOODSHORT[ans.food]}에 잘 어울려요`);}
      else sc-=1.5;
      if(ans.food==='dessert'&&w.s<3) sc-=4;
      if(ans.food==='spicy'&&w.t>=4) sc-=2;
      if(ans.food==='seafood'&&w.type==='red'&&w.t>=3) sc-=2;
    }else if(ans.food==='none'&&w.food.includes('none')){sc+=1;why.push('음식 없이 그냥 마셔도 맛있어요');}
    // 자리
    if(ans.occ&&w.occ.includes(ans.occ)){sc+=1.5;why.push(OCCWHY[ans.occ]);}
    // 예산
    if(budget){ if(w.price.includes(budget)) sc+=1.5; else sc-=2.5; }
    // 기록
    if(liked.includes(w.id)){sc+=2.5;why.unshift('전에 마시고 좋았다고 기록한 스타일이에요');}
    else if(liked.some(id=>{const l=WMAP[id];return l.grape===w.grape||(l.type===w.type&&Math.abs(l.s-w.s)+Math.abs(l.a-w.a)+Math.abs(l.b-w.b)<=2);})){sc+=1;why.push('전에 좋았던 와인과 비슷한 스타일이에요');}
    if(disliked.includes(w.id)) sc-=4;
    // 맛 설명
    const tw=[];
    if(T.s<=1.5&&w.s<=1) tw.push('달지 않은 맛을 좋아하셔서 드라이한 와인으로 골랐어요');
    if(T.s>=3.5&&w.s>=3) tw.push('달콤한 맛을 좋아하셔서 단맛이 있는 와인이에요');
    if(T.a>=4&&w.a>=4) tw.push('상큼한 맛을 좋아하셔서 산미가 살아 있어요');
    if(T.a<=2.2&&w.a<=3) tw.push('신맛이 강하지 않아 편하게 마실 수 있어요');
    if(T.b>=4&&w.b>=4) tw.push('진한 맛을 좋아하셔서 묵직한 와인이에요');
    if(T.b<=2&&w.b<=2) tw.push('가볍고 깔끔한 맛을 원하셔서 산뜻한 와인이에요');
    if(T.t<=2&&w.t<=2&&w.type==='red') tw.push('떫은맛이 적은 부드러운 레드예요');
    return {w,sc,why:[...tw.slice(0,2),...why]};
  }).sort((x,y)=>y.sc-x.sc);
  const pick=[];const grapes=new Set();const typeCount={};
  for(const it of scored){
    if(pick.length>=4)break;
    if(grapes.has(it.w.grape)&&pick.length<3)continue;
    if((ans.type==='any'||!ans.type)&&(typeCount[it.w.type]||0)>=3)continue;
    pick.push(it);grapes.add(it.w.grape);typeCount[it.w.type]=(typeCount[it.w.type]||0)+1;
  }
  for(const it of scored){if(pick.length>=4)break;if(!pick.includes(it))pick.push(it);}
  pick.forEach(it=>{const u=[...new Set(it.why)];it.why=u.slice(0,3);if(!it.why.length)it.why=['맛의 균형이 좋아 처음 마시기에도 편해요'];});
  return {T,items:pick.map(it=>({id:it.w.id,why:it.why})),ans,date:new Date().toISOString()};
}
function nickname(T,type){
  let f='균형파';
  if(T.s>=3.5)f='달콤파';else if(T.a>=4.5&&T.b<=3)f='상큼파';else if(T.b>=4.5)f='진한맛파';else if(T.b<=1.5)f='깔끔파';
  const t=type&&type!=='any'?TYPES[type].label:'와인';
  return `${f} ${t} 탐험가`;
}

const lineTimers=new WeakMap();
function prepLine(card){
  (lineTimers.get(card)||[]).forEach(clearTimeout);lineTimers.set(card,[]);
  card.querySelectorAll('.lineart [data-t]').forEach(el=>{
    if(el.classList.contains('fd')){el.classList.remove('on');return;}
    let len=60;try{len=el.getTotalLength()+2;}catch(e){}
    el.style.transition='none';
    if(el.classList.contains('d')){el.style.opacity='0';return;}
    el.style.strokeDasharray=len;el.style.strokeDashoffset=len;
  });
}
function playLine(card){
  prepLine(card);void card.offsetWidth;const list=lineTimers.get(card);
  card.querySelectorAll('.lineart [data-t]').forEach(el=>{
    const t=lineReduced?0:parseFloat(el.dataset.t)*1000,u=lineReduced?0:parseFloat(el.dataset.u||'.8');
    list.push(setTimeout(()=>{
      if(el.classList.contains('fd')){el.classList.add('on');return;}
      if(el.classList.contains('d')){el.style.transition=`opacity ${u}s ease`;el.style.opacity='1';return;}
      el.style.transition=`stroke-dashoffset ${u}s cubic-bezier(.45,.05,.3,1)`;el.style.strokeDashoffset='0';

  });
}

/* ---------- 사진 저장 (IndexedDB) ---------- */
const memPhotos={};
const PDB={db:null,
  open(){return new Promise(res=>{if(this.db)return res(this.db);try{const r=indexedDB.open('winepick',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>res(null);}catch(e){res(null);}});},
  async get(k){if(!k)return null;if(memPhotos[k])return memPhotos[k];const db=await this.open();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('photos').objectStore('photos').get(k);q.onsuccess=()=>{if(q.result)memPhotos[k]=q.result;res(q.result||null);};q.onerror=()=>res(null);}catch(e){res(null);}});},
  async set(k,v){memPhotos[k]=v;const db=await this.open();if(!db)return;return new Promise(res=>{try{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});},
  async del(k){delete memPhotos[k];const db=await this.open();if(!db)return;try{db.transaction('photos','readwrite').objectStore('photos').delete(k);}catch(e){}}
};
/* ---------- 사진 위치·크기 조정 ---------- */
function openCropper(src,opt){opt=opt||{};
  return new Promise(resolve=>{
    const o=document.createElement('div');o.className='crop-ov';
    o.innerHTML=`<div class="crop-top"><b>사진 위치 맞추기</b><span>두 손가락으로 확대·축소하고, 끌어서 위치를 옮겨요</span></div>
    <div class="crop-stage" id="cStage"><img id="cImg" alt="" draggable="false"><div class="crop-grid"></div></div>
    <div class="crop-zoom"><button type="button" id="cOut" aria-label="축소">−</button><input type="range" id="cRange" min="0" max="100" value="0" aria-label="확대 정도"><button type="button" id="cIn" aria-label="확대">+</button></div>
    <div class="crop-btns"><button type="button" class="btn ghost" id="cCancel">취소</button><button type="button" class="btn ghost" id="cReset">원래대로</button><button type="button" class="btn" id="cOk">사용하기</button></div>${opt.edit?`<div class="crop-more"><button type="button" id="cChange">다른 사진으로 바꾸기</button><span>·</span><button type="button" id="cDel">사진 지우기</button></div>`:''}`;
    document.body.appendChild(o);
    const st=o.querySelector('#cStage'),im=o.querySelector('#cImg'),rg=o.querySelector('#cRange');
    let W=0,H=0,iw=0,ih=0,minS=1,maxS=4,s=1,tx=0,ty=0;
    const pts=new Map();let last=null;
    const clamp=()=>{s=Math.max(minS,Math.min(maxS,s));tx=Math.min(0,Math.max(W-iw*s,tx));ty=Math.min(0,Math.max(H-ih*s,ty));};
    const draw=()=>{clamp();im.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;rg.value=Math.round((s-minS)/(maxS-minS)*100);};
    const zoomAt=(ns,cx,cy)=>{ns=Math.max(minS,Math.min(maxS,ns));tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;draw();};
    const fit=()=>{s=minS;tx=(W-iw*s)/2;ty=(H-ih*s)/2;draw();};
    im.onload=()=>{iw=im.naturalWidth;ih=im.naturalHeight;const r=st.getBoundingClientRect();W=r.width;H=r.height;minS=Math.max(W/iw,H/ih);maxS=minS*4;fit();};
    im.onerror=()=>{close(null);toast('이 사진은 열 수 없어요');};
    im.src=src;
    const local=e=>{const r=st.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
    st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,local(e));last=null;});
    st.addEventListener('pointermove',e=>{
      if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId),cur=local(e);pts.set(e.pointerId,cur);
      if(pts.size===1){tx+=cur[0]-prev[0];ty+=cur[1]-prev[1];draw();}
      else if(pts.size===2){const [a,b]=[...pts.values()];const dist=Math.hypot(a[0]-b[0],a[1]-b[1]),mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
        if(last){tx+=mid[0]-last.mid[0];ty+=mid[1]-last.mid[1];zoomAt(s*dist/last.dist,mid[0],mid[1]);}last={dist,mid};}
    });
    const up=e=>{pts.delete(e.pointerId);last=null;};
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>st.addEventListener(ev,up));
    st.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=local(e);zoomAt(s*(e.deltaY<0?1.08:1/1.08),x,y);},{passive:false});
    rg.oninput=()=>zoomAt(minS+(maxS-minS)*rg.value/100,W/2,H/2);
    o.querySelector('#cIn').onclick=()=>zoomAt(s*1.15,W/2,H/2);
    o.querySelector('#cOut').onclick=()=>zoomAt(s/1.15,W/2,H/2);
    o.querySelector('#cReset').onclick=fit;
    function close(v){o.remove();resolve(v);}
    o.querySelector('#cCancel').onclick=()=>close(null);
    if(opt.edit){o.querySelector('#cChange').onclick=()=>{close(null);opt.onChange&&opt.onChange();};
      const dl=o.querySelector('#cDel');let armed=false;dl.onclick=()=>{if(!armed){armed=true;dl.textContent='한 번 더 누르면 지워요';setTimeout(()=>{armed=false;dl.textContent='사진 지우기';},2500);return;}close(null);opt.onDelete&&opt.onDelete();};}
    o.querySelector('#cOk').onclick=()=>{
      try{const OW=600,OH=800,c=document.createElement('canvas');c.width=OW;c.height=OH;const g=c.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,OW,OH);g.drawImage(im,-tx/s,-ty/s,W/s,H/s,0,0,OW,OH);close(c.toDataURL('image/jpeg',.8));}
      catch(e){toast('사진을 저장하지 못했어요');close(null);}
    };
  });
}
function shrinkPhoto(file,max=720,q=.72){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{try{let w=img.naturalWidth,hh=img.naturalHeight;const k=Math.min(1,max/Math.max(w,hh));w=Math.round(w*k);hh=Math.round(hh*k);
      const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(img,0,0,w,hh);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));}catch(e){rej(e);}};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;
  });
}
function hydratePhotos(root){(root||document).querySelectorAll('[data-photo]').forEach(async el=>{const k=el.dataset.photo;if(!k)return;const d=await PDB.get(k);if(d){el.innerHTML=`<img src="${d}" alt="">`;el.classList.add('has');}});}
function fmtPrice(r){
  if(r.price==null||r.price==='')return '';
  const n=typeof r.price==='number'?r.price:parseFloat(String(r.price).replace(/[^0-9.]/g,''));
  if(typeof r.price!=='number'&&(!r.cur||isNaN(n)))return String(r.price);
  if(isNaN(n))return '';
  return (r.cur||settings.currency)==='KRW'?'₩'+Math.round(n).toLocaleString('ko-KR'):'$'+(Number.isInteger(n)?n.toLocaleString('en-US'):n.toFixed(2));
}

function nextLine(arr,key){let d=store.get(key,null);if(!Array.isArray(d)||!d.length||d.some(i=>i>=arr.length)){d=arr.map((_,i)=>i);for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}}const i=d.pop();store.set(key,d);return arr[i];}
const SOMM=['좋은 와인은 좋은 사람과 마실 때 완성돼요.','비싼 와인보다 내 입에 맞는 와인이 최고의 와인이에요.','한 모금 마시고 30초만 기다려 보세요. 맛이 조금씩 달라져요.','모르는 와인 앞에서는 라벨이 예쁜 걸 골라도 괜찮아요. 그것도 와인을 즐기는 방법이에요.','오늘 마신 와인을 기억하는 가장 좋은 방법은 기록이에요.','잔을 돌리는 건 멋 부리는 게 아니라 향을 깨우는 거예요.','레드는 생각보다 시원하게, 화이트는 생각보다 덜 차갑게.','입에 안 맞은 와인도 다음 와인을 고르는 힌트가 돼요.','와인에 정답은 없어요. 맛있으면 그게 정답이에요.','남은 와인은 요리에 넣어 보세요. 파스타 소스가 달라져요.','와인 가게 직원에게 묻는 건 부끄러운 일이 아니에요. 그들은 그 질문을 기다려요.','같은 와인도 누구와, 어디서 마시느냐에 따라 맛이 달라요.',"와인 잔은 다리를 잡으세요. 손의 온기가 와인을 데우지 않아요.","잔은 3분의 1만 채우세요. 남은 공간에 향이 모여요.","처음 여는 와인은 한두 잔 따른 뒤 10분만 기다려 보세요. 맛이 부드러워져요.","코르크 냄새가 젖은 신문지 같다면 와인이 상한 거예요. 바꿔 달라고 해도 돼요.","스크루 캡 와인이라고 싸구려가 아니에요. 뉴질랜드 와인은 대부분 스크루 캡이에요.","빈티지는 포도를 수확한 해예요. 병에 담은 해가 아니에요.","와인의 눈물(잔 벽을 타고 흐르는 자국)은 품질이 아니라 알코올과 당도를 보여 줘요.","단맛과 과일 맛은 달라요. 과일 향이 풍부해도 드라이한 와인이 많아요.","떫은맛은 혀가 아니라 잇몸과 볼 안쪽에서 느껴져요.","치즈와 와인이 어울리지 않으면, 같은 지역 것끼리 맞춰 보세요.","매운 음식엔 도수 낮고 살짝 단 와인이 매운맛을 달래 줘요.","기름진 음식엔 산도 높은 와인이 입안을 개운하게 해 줘요.","생선엔 화이트라는 규칙은 깨도 돼요. 연어엔 피노 누아가 잘 어울려요.","초콜릿 디저트엔 디저트보다 단 와인을 고르세요. 그래야 와인이 시어지지 않아요.","샴페인은 '펑' 소리 없이 '쉬익' 하고 여는 게 정석이에요.","스파클링 와인은 플루트 잔보다 화이트 와인 잔에 마시면 향이 더 잘 느껴져요.","남은 스파클링은 숟가락보다 전용 마개로 막는 게 확실해요.","남은 와인은 냉장고에 넣으면 레드도 2~3일은 버텨요.","와인은 눕혀서 보관하면 코르크가 마르지 않아요.","와인의 적은 빛, 열, 흔들림이에요. 서늘하고 어두운 곳이 최고예요.","'리저브'라는 말은 나라마다 뜻이 달라요. 꼭 더 좋은 와인이라는 뜻은 아니에요.","같은 품종도 서늘한 곳에서 자라면 상큼하고, 따뜻한 곳에서 자라면 진해져요.","병 바닥이 움푹 들어간 건 침전물을 모으고 병을 튼튼하게 하려는 거예요.","와인 잔을 씻을 땐 세제를 조금만. 세제 냄새가 와인 향을 가려요.","마시기 전에 물 한 모금. 입이 깨끗해야 와인 맛이 정확해요.","와인 한 잔, 물 한 잔. 다음 날 아침이 달라져요.","첫 잔의 인상과 마지막 잔의 인상을 비교해 보세요. 와인은 잔 속에서 변해요.","마음에 든 와인은 라벨 사진을 찍어 두세요. 다음에 찾기 쉬워요.","같은 가격이면 유명한 지역보다 덜 알려진 지역 와인이 더 맛있을 때가 많아요.","칠레, 아르헨티나, 포르투갈 와인은 가격 대비 맛이 좋기로 유명해요.","레스토랑에서 두 번째로 싼 와인을 고를 필요는 없어요. 소믈리에에게 예산을 말해 보세요.","소믈리에에게 예산을 말할 땐 와인 리스트의 가격을 손가락으로 가리키면 돼요.","테이스팅은 와인이 상했는지 확인하는 거예요. 입에 안 맞는다고 돌려보내는 자리는 아니에요.","와인 향을 표현할 땐 정답이 없어요. 떠오르는 대로 말해도 돼요.","향을 맡을 땐 짧게 여러 번 맡아 보세요. 코가 금방 지쳐요.","'미네랄'은 돌을 핥은 듯한 느낌이에요. 비 온 뒤 돌 냄새를 떠올려 보세요.","오크통 숙성 와인에서는 바닐라, 토스트, 커피 향이 나요.","버터 향 나는 샤르도네는 젖산 발효 덕분이에요.","로제 와인은 레드 포도 껍질을 잠깐만 담가서 만든 거예요.","화이트 와인은 껍질을 빼고 만들어서 레드 포도로도 만들 수 있어요.","샴페인은 프랑스 샹파뉴 지역에서 만든 스파클링만 부를 수 있는 이름이에요.","프로세코는 탱크에서, 샴페인은 병 속에서 두 번째 발효를 해요.","'브뤼'는 드라이한 스파클링, '드미 섹'은 단 스파클링이에요.","와인 이름이 품종인 나라도 있고, 지역인 나라도 있어요. 프랑스는 주로 지역이에요.","부르고뉴 레드는 피노 누아, 부르고뉴 화이트는 샤르도네예요.","보르도 와인은 보통 여러 품종을 섞어서 만들어요.","리오하의 '그란 레세르바'는 오래 숙성한 와인이라는 표시예요.","독일 리슬링 라벨의 '트로켄'은 드라이하다는 뜻이에요.","포트 와인은 발효 중에 브랜디를 넣어 달고 도수가 높아요.","디저트 와인은 작은 잔에 조금씩. 한 병으로 여럿이 나눠 마셔요.","보졸레 누보는 그해 11월 셋째 목요일에 나오는 햇와인이에요.","오래 숙성할 와인은 일부예요. 대부분의 와인은 사고 1~2년 안에 마시는 게 좋아요.","비싼 와인일수록 마시기 좋은 때가 따로 있어요. 너무 일찍 열면 닫혀 있어요.","디캔팅은 오래된 와인의 찌꺼기를 거르거나, 어린 와인에 숨을 불어넣는 거예요.","디캔터가 없으면 큰 물병에 부었다 다시 담아도 돼요.","와인이 너무 차가우면 손으로 잔을 감싸 잠깐 데우세요.","레드 와인을 얼음물에 15분 담그면 딱 좋은 온도가 돼요.","화이트 와인은 냉장고에서 꺼내 15분 뒤가 마시기 좋아요.","여름엔 가벼운 레드를 살짝 차갑게. 피노 누아, 가메가 잘 어울려요.","겨울엔 따뜻하게 데운 뱅쇼도 와인을 즐기는 방법이에요.","피자엔 이탈리아 레드, 특히 키안티가 정답에 가까워요.","삼겹살엔 과일 향 진한 레드나 상큼한 로제를 곁들여 보세요.","치킨엔 차가운 스파클링. 튀김 기름을 깔끔하게 씻어 줘요.","회와 초밥엔 드라이한 화이트나 스파클링이 비린 맛을 잡아 줘요.","불고기처럼 단짠 음식엔 과일 향 풍부한 레드가 잘 맞아요.","김치찌개엔 와인보다 물이 나을 수도 있어요. 그래도 도전한다면 리슬링.","와인은 음식과 함께할 때 더 맛있어지도록 만들어진 술이에요.","선물할 땐 받는 사람이 좋아하는 음식을 떠올려 보세요.","선물로 받은 와인은 그날 바로 열지 않아도 괜찮아요.","초대받은 집에 가져간 와인을 그날 꼭 열자고 하지 않는 게 예의예요.","건배할 땐 잔의 볼 부분끼리 살짝. 가장 맑은 소리가 나요.","건배할 땐 상대의 눈을 보세요. 유럽에선 그게 예의예요.","와인 가게에서 '이번 주 추천'은 직원이 직접 맛본 와인일 때가 많아요.","마트 와인도 충분히 맛있어요. 비싼 와인만 좋은 와인은 아니에요.","라벨 뒷면에 맛 설명과 어울리는 음식이 적혀 있을 때가 많아요.","도수가 14%를 넘으면 진하고 묵직한 와인일 가능성이 커요.","도수가 낮은 와인은 대체로 가볍고 산뜻해요.","한 병은 보통 750ml, 잔으로 대략 다섯 잔이에요.","매그넘은 일반 병 두 개 크기예요. 파티에 딱이에요.","스크루 캡 와인은 오프너가 필요 없어서 피크닉에 딱이에요.","코르크가 부서져 들어갔다면 체에 걸러 따르면 돼요.","와인을 쏟았다면 소금이나 탄산수를 바로 뿌려 보세요.","레드 와인 얼룩엔 화이트 와인이 도움이 된다는 말도 있어요.","와인 맛이 기억나지 않는다면, 그날 누구와 있었는지 떠올려 보세요.","좋아하는 와인 하나를 정해 두면 새 와인을 비교하기 쉬워요.","가끔은 전혀 모르는 나라의 와인을 골라 보세요. 새로운 세계가 열려요.","와인은 배우는 게 아니라 마셔 보는 거예요. 한 잔씩 쌓이면 다 알게 돼요.","와인은 천천히. 한 잔에 이야기 하나면 충분해요."];
function bindSecret(){
  const shelf=view.querySelector('.shelf');if(!shelf)return;
  let t=null,sx=0,sy=0;
  const cancel=()=>{clearTimeout(t);t=null;};
  shelf.addEventListener('pointerdown',e=>{
    if(e.target.closest('.bt')||shelf.querySelector('.secret-wrap'))return;
    sx=e.clientX;sy=e.clientY;const r=shelf.getBoundingClientRect();const x=e.clientX-r.left;
    t=setTimeout(()=>{t=null;revealSecret(shelf,x);},650);
  });
  shelf.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))cancel();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>shelf.addEventListener(ev,cancel));
  shelf.addEventListener('contextmenu',e=>e.preventDefault());
}
function revealSecret(shelf,x){
  const w=document.createElement('div');w.className='secret-wrap';
  w.style.left=Math.max(24,Math.min(shelf.clientWidth-24,x))+'px';
  w.innerHTML=`<button class="secret" aria-label="숨은 와인병">${bottle('#26262B','리저브')}</button>`;
  shelf.appendChild(w);
  try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.firstElementChild.classList.add('up')));
  let hide=setTimeout(()=>sink(),6000);
  function sink(){const b=w.firstElementChild;if(!b)return;b.classList.remove('up');setTimeout(()=>w.remove(),700);}
  w.firstElementChild.onclick=()=>{clearTimeout(hide);showSomm(()=>{hide=setTimeout(sink,1500);});};
}
function showSomm(onClose){
  const q=nextLine(SOMM,'sommDeck');
  const o=document.createElement('div');o.className='celebrate';
  o.innerHTML=`<div class="cel-card somm"><div class="cel-medal" style="margin-top:-78px">${bottle('#26262B','리저브').replace('<svg','<svg width="56" height="158"')}</div>
  <div class="cel-k" style="color:#B88A3E">SECRET RESERVE</div><div class="cel-n" style="font-size:20px;margin-top:6px">오늘의 소믈리에 한마디</div><div class="cel-e">Sommelier's note</div>
  <p style="font-size:17px;line-height:1.6;margin:16px 4px 18px">“${q}”</p><button class="btn block">고마워요</button></div>`;
  o.onclick=e=>{if(e.target===o||e.target.closest('button')){o.remove();onClose&&onClose();}};
  document.body.appendChild(o);
}
/* ---------- 기념 메달 (이스터에그) ---------- */
const MEDALS=[{n:10,name:'와인 입문자',en:'Wine Beginner',c:['#E8A36E','#8A4F24']},{n:30,name:'와인 애호가',en:'Wine Lover',c:['#F2F2F6','#8E8E99']},{n:50,name:'꼬마 소믈리에',en:'Little Sommelier',c:['#FBE08A','#A87A1C']}];
function medalSVG(m,w){const id='m'+(++BID);return `<svg width="${w}" height="${w*1.35}" viewBox="0 0 40 54" aria-hidden="true"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${m.c[0]}"/><stop offset="1" stop-color="${m.c[1]}"/></radialGradient></defs>
<path d="M10 0h8l4 16-6 4z" fill="#B30737"/><path d="M30 0h-8l-4 16 6 4z" fill="#8A0529"/>
<circle cx="20" cy="34" r="16" fill="url(#${id})" stroke="${m.c[1]}" stroke-width="1.2"/><circle cx="20" cy="34" r="12" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/>
<text x="20" y="38.5" text-anchor="middle" font-size="12" font-weight="800" fill="${m.c[1]}" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif">${m.n}</text></svg>`;}
function medalRow(count){
  const got=MEDALS.filter(m=>count>=m.n);if(!got.length)return '';
  const next=MEDALS.find(m=>count<m.n);
  return `<div class="medals">${got.map(m=>`<div class="medal">${medalSVG(m,30)}<span>${m.name}<small>${m.en}</small></span></div>`).join('')}${next?`<div class="medal-next">다음 메달까지 ${next.n-count}병</div>`:''}</div>`;
}
function checkMedal(before,after){
  const m=MEDALS.find(x=>before<x.n&&after>=x.n);if(!m)return;
  setTimeout(()=>{
    const o=document.createElement('div');o.className='celebrate';
    let conf='';for(let i=0;i<26;i++){conf+=`<i style="left:${Math.random()*100}%;background:${['#F3D9A4','#E0315F','#F7C7D2','#C9B45A','#fff'][i%5]};animation-delay:${Math.random()*.6}s;animation-duration:${1.6+Math.random()*1.2}s;--dx:${(Math.random()-.5)*120}px"></i>`;}
    o.innerHTML=`<div class="conf">${conf}</div><div class="cel-card"><div class="cel-medal">${medalSVG(m,90)}</div><div class="cel-k">🎉 ${m.n}병 달성!</div><div class="cel-n">${m.name}</div><div class="cel-e">${m.en}</div><p class="small" style="color:#7A6567;margin:10px 0 16px">나의 셀러에 와인이 ${m.n}병 쌓였어요.<br>메달을 셀러 선반에 걸어 둘게요.</p><button class="btn block">좋아요</button></div>`;
    o.onclick=e=>{if(e.target===o||e.target.closest('button'))o.remove();};
    document.body.appendChild(o);try{navigator.vibrate&&navigator.vibrate([30,40,30]);}catch(e){}
  },400);
}
function recCard(r){

  return `<button class="rec" data-edit="${esc(r.id)}"><div class="g" ${r.photo?`data-photo="${esc(r.photo)}"`:''}>${glass(type,28)}</div><div class="t"><b>${esc(r.name)}</b><span class="stars">${stars(r.rating||0)}</span> <span class="muted small">${esc(fmtDate(r.date))}${pr?' · '+esc(pr):''}</span>${r.memo?`<div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.memo)}</div>`:''}</div>${chev}</button>`;
}
function fmtDate(d){if(!d)return'';const p=d.split('-');return p.length===3?`${+p[1]}월 ${+p[2]}일`:d;}
function renderLog(){
  const recs=store.get('records',[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let h=`<div class="sec-title"><h1 class="thin" style="margin:0">내 와인 기록</h1><button class="btn" id="addRec" style="min-height:42px;padding:10px 14px">+ 기록</button></div>`;
  if(!recs.length){
    h+=`<div class="card empty">${glass('red',60)}<p style="margin-top:10px"><b>아직 기록이 없어요</b></p><p class="small">마셔 본 와인을 별점과 함께 남겨 보세요.<br>좋았던 스타일은 다음 추천에 더 많이 나와요.</p><button class="btn block" id="addRec2">첫 와인 기록하기</button></div>`;
  }else{

const nrm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\s\-·'’.,()\/&!?"“”:#]/g,'');
const SR_ATTR=[

 ['type','red',['레드','red']],['type','white',['화이트','white']],['type','rose',['로제','rose']],['type','sparkling',['스파클링','거품','sparkling']],['type','dessert',['디저트','dessert']],

].map(a=>[a[0],a[1],a[2].map(nrm)]);
const TASTE_OK={sweet:w=>w.s>=3,dry:w=>w.s<=1,acid:w=>w.a>=4,heavy:w=>w.b>=4,light:w=>w.b<=2,tannic:w=>w.t>=4,soft:w=>w.type==='red'&&w.t<=2};
let SRIDX=null,SRQ='';
function buildSearchIndex(){
  const styles=WINES.map(w=>({w,ix:nrm([w.name,w.grape,w.aroma,w.desc,w.ex,TYPES[w.type].label,TYPE_WORDS[w.type],STYLE_ALIAS[w.id]||''].join(' ')),nm:nrm(w.name)}));
  const prods=[];WINES.forEach(w=>(PRODUCTS[w.id]||[]).forEach(p=>prods.push({p,w,nm:nrm(p[0]+' '+p[1]),ix:nrm([p[0],p[1],p[3],p[4],w.name,w.grape,TYPE_WORDS[w.type],STYLE_ALIAS[w.id]||''].join(' '))})));
  const strip=h=>String(h).replace(/<[^>]+>/g,' ');
  const learn=[];LEVELS.forEach(l=>l.cards.forEach((c,i)=>learn.push({l,i,c,ix:nrm([c.k,c.t,strip(c.b),strip(c.tip)].join(' '))})));
  SRIDX={styles,prods,learn};
}
function parseQuery(q){
  const toks=q.trim().split(/\s+/).filter(Boolean),attrs=[],texts=[];
  toks.forEach(tk=>{const n=nrm(tk);if(!n)return;let hit=null;
    for(const a of SR_ATTR){if(a[2].some(wd=>n===wd||(wd.length>=2&&n.startsWith(wd)))){hit=a;break;}}
    if(hit)attrs.push(hit);else texts.push(n);});
  return {attrs,texts};
}
function styleOkAttrs(w,attrs,tier){
  return attrs.every(([k,v])=>k==='food'?w.food.includes(v):k==='occ'?w.occ.includes(v):k==='taste'?TASTE_OK[v](w):k==='type'?w.type===v:k==='price'?(tier!=null?tier===v:w.price.includes(v)):true);
}
function runSearch(q){
  if(!SRIDX)buildSearchIndex();
  const {attrs,texts}=parseQuery(q);if(!attrs.length&&!texts.length)return null;
  const tm=ix=>texts.every(t=>ix.includes(t));
  const score=(nm)=>texts.length?(nm.startsWith(texts[0])?3:nm.includes(texts[0])?2:0):0;
  const styles=SRIDX.styles.filter(s=>tm(s.ix)&&styleOkAttrs(s.w,attrs)).sort((a,b)=>score(b.nm)-score(a.nm));
  const prods=SRIDX.prods.filter(s=>tm(s.ix)&&styleOkAttrs(s.w,attrs,s.p[2])).sort((a,b)=>score(b.nm)-score(a.nm)||a.p[2]-b.p[2]);
  const learn=texts.length&&!attrs.length?SRIDX.learn.filter(s=>tm(s.ix)):[];
  const recs=texts.length?store.get('records',[]).filter(r=>tm(nrm([r.name,r.memo,r.food,(WMAP[r.style]||{}).name].join(' ')))):[];
  return {styles,prods,learn,recs};
}

async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg);return;}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok){toast(msg);return;}}catch(e){}

}

  o.onclick=e=>{if(e.target===o)close();};
  o.querySelector('#ckGo').onclick=()=>setTimeout(close,300);
  o.querySelector('#ckNo').onclick=()=>{close();toast('와인도 좋은 선택이에요 🍷');};
  document.body.appendChild(o);try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}
}
(function bindBrandPress(){
  const br=document.querySelector('.brand');if(!br)return;
  let t=null,fired=false,sx=0,sy=0;
  const cancel=()=>{clearTimeout(t);t=null;br.classList.remove('pressing');};
  br.addEventListener('pointerdown',e=>{fired=false;sx=e.clientX;sy=e.clientY;br.classList.add('pressing');t=setTimeout(()=>{t=null;fired=true;br.classList.remove('pressing');showCocktailInvite();},650);});
  br.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))cancel();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>br.addEventListener(ev,cancel));
  br.addEventListener('contextmenu',e=>e.preventDefault());
  br.addEventListener('click',e=>{if(fired){e.preventDefault();e.stopImmediatePropagation();fired=false;}},true);
})();
/* 시작 화면 */
(function splash(){
  const sp=$('#splash');if(!sp)return;
  for(let i=0;i<14;i++){const b=document.createElement('i');b.className='bub';const z=4+Math.random()*9;
    b.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;animation-duration:${4+Math.random()*4}s;animation-delay:${Math.random()*3}s;--dx:${(Math.random()-.5)*60}px`;sp.appendChild(b);}
  let reduced=false;try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  let done=false;
  function leave(){if(done)return;done=true;sp.classList.add('out');const app=$('#app');app.classList.add('enter');
    setTimeout(()=>{sp.remove();app.classList.remove('enter');},850);}
  sp.addEventListener('click',leave);
  sp.addEventListener('touchend',e=>{e.preventDefault();leave();},{passive:false});
  setTimeout(leave,reduced?1500:4600);
  sp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();leave();}});
  try{sp.focus();}catch(e){}
})();
S.tab='home';try{if(location.hash)history.replaceState(null,'',location.pathname+location.search);}catch(e){}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==S.tab&&['home','learn','pick','log'].includes(h)){S.tab=h;render();}});
render();
})();
